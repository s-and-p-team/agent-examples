[project]
name = "newsroom-summarizer"
version = "1.0.0"
description = "Summary Desk A2A agent — condenses an article to the editor's angle and delegates the headline, for the newsroom example."
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk[http-server]>=1.1.0",
    "mcp>=2.0.0",
    "httpx2>=2.10.0",
    "httpx>=0.27.0",
    "uvicorn>=0.49.0",
    "starlette>=1.3.1",
]

[project.scripts]
server = "newsroom_summarizer.agent:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newsroom_summarizer"]
