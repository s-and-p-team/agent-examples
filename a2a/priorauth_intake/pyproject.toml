[project]
name = "priorauth-intake"
version = "1.0.0"
description = "Referral Intake A2A agent — turns a clinical referral note into a prior-authorization determination, for the prior-authorization example."
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk[http-server]>=1.1.0",
    "mcp>=1.28.1",
    "httpx>=0.27.0",
    "uvicorn>=0.49.0",
    "starlette>=1.3.1",
]

[project.scripts]
server = "priorauth_intake.agent:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/priorauth_intake"]
