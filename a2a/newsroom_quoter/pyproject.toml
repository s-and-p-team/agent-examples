[project]
name = "newsroom-quoter"
version = "1.0.0"
description = "Quote Desk A2A agent — picks a verbatim pull-quote from an article, for the newsroom example."
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk[http-server]>=1.1.0",
    "mcp>=2.0.0",
    "httpx2>=2.10.0",
    "httpx>=0.27.0",
    "uvicorn>=0.49.0",
    "starlette>=1.3.1",
]

[project.scripts]
server = "newsroom_quoter.agent:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newsroom_quoter"]
