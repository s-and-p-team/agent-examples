[project]
name = "priorauth-authstore-tool"
version = "1.0.0"
description = "Authorization Store MCP tool — write-only persistence of referrals and decisions for the prior-authorization example."
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.4.2",
    "psycopg[binary]>=3.2.0",
    "uvicorn>=0.49.0",
    "starlette>=1.3.1",
]

[project.scripts]
server = "priorauth_authstore_tool:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["priorauth_authstore_tool.py"]
