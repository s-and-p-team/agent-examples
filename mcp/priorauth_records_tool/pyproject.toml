[project]
name = "priorauth-records-tool"
version = "1.0.0"
description = "Patient Records MCP tool — read-only access to member demographics, coverage policies and clinical history for the prior-authorization example."
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.4.2",
    "psycopg[binary]>=3.2.0",
    "uvicorn>=0.49.0",
    "starlette>=1.3.1",
]

[project.scripts]
server = "priorauth_records_tool:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["priorauth_records_tool.py"]
