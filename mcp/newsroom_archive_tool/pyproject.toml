[project]
name = "newsroom-archive-tool"
version = "1.0.0"
description = "Story Archive MCP tool — in-memory artifact store every newsroom agent files its output into, for the newsroom example."
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.4.2",
    "uvicorn>=0.49.0",
    "starlette>=1.3.1",
]

[project.scripts]
server = "newsroom_archive_tool:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["newsroom_archive_tool.py"]
