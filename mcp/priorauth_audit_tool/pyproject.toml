[project]
name = "priorauth-audit-tool"
version = "1.0.0"
description = "Audit Trail MCP tool — appends determinations to a shared file and Redis for the prior-authorization example."
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.4.2",
    "redis>=5.0.0",
    "uvicorn>=0.49.0",
    "starlette>=1.3.1",
]

[project.scripts]
server = "priorauth_audit_tool:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["priorauth_audit_tool.py"]
