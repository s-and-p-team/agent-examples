# priorauth-audit-tool — part of the prior-authorization example.
#
# Deployed the rossoctl way: a plain Deployment + Service, adopted by an
# AgentRuntime. The AgentRuntime is what stamps rossoctl.io/type and asks the
# operator to inject the AuthBridge sidecar — the label cannot be set by hand
# (ValidatingAdmissionPolicy agent-label-protection reserves it).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: priorauth-audit-tool
  namespace: team2
---
apiVersion: v1
kind: Service
metadata:
  name: priorauth-audit-tool
  namespace: team2
  labels:
    app.kubernetes.io/name: priorauth-audit-tool
spec:
  ports:
    - name: http
      port: 8000
      protocol: TCP
      targetPort: 8000
  selector:
    app.kubernetes.io/name: priorauth-audit-tool
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: priorauth-audit-tool
  namespace: team2
  labels:
    app.kubernetes.io/name: priorauth-audit-tool
    app.kubernetes.io/component: tool
    app.kubernetes.io/part-of: priorauth
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: priorauth-audit-tool
  template:
    metadata:
      labels:
        app.kubernetes.io/name: priorauth-audit-tool
        app.kubernetes.io/part-of: priorauth
    spec:
      serviceAccountName: priorauth-audit-tool
      containers:
        - name: tool
          image: docker.io/library/priorauth_audit_tool:latest
          imagePullPolicy: IfNotPresent
          env:
            - { name: HOST, value: "0.0.0.0" }
            - { name: PORT, value: "8000" }
            - { name: AUDIT_DIR, value: "/audit" }
            - { name: REDIS_URL, value: "redis://priorauth-audit-redis.team2.svc.cluster.local:6379" }
          ports:
            - { containerPort: 8000, name: http }
          readinessProbe:
            tcpSocket: { port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 24
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts:
            - { name: audit, mountPath: /audit }
      volumes:
        - name: audit
          persistentVolumeClaim:
            claimName: priorauth-audit-files
---
apiVersion: agent.rossoctl.dev/v1alpha1
kind: AgentRuntime
metadata:
  name: priorauth-audit-tool
  namespace: team2
spec:
  type: tool
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: priorauth-audit-tool
---
# The audit file store. Written by the audit tool; never read by the pipeline.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: priorauth-audit-files
  namespace: team2
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 100Mi
---
# Redis — the operations dashboard's copy of each determination. RESP is not
# HTTP, so nothing in the HTTP path observes these writes.
apiVersion: v1
kind: Service
metadata:
  name: priorauth-audit-redis
  namespace: team2
  labels:
    app.kubernetes.io/name: priorauth-audit-redis
spec:
  ports:
    - { name: redis, port: 6379, protocol: TCP, targetPort: 6379 }
  selector:
    app.kubernetes.io/name: priorauth-audit-redis
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: priorauth-audit-redis
  namespace: team2
  labels:
    app.kubernetes.io/name: priorauth-audit-redis
    app.kubernetes.io/part-of: priorauth
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: priorauth-audit-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: priorauth-audit-redis
        app.kubernetes.io/part-of: priorauth
    spec:
      containers:
        - name: redis
          image: docker.io/library/redis:7
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 6379, name: redis }
          readinessProbe:
            tcpSocket: { port: 6379 }
            initialDelaySeconds: 3
            periodSeconds: 5
