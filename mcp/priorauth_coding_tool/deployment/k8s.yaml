# priorauth-coding-tool — part of the prior-authorization example.
#
# Deployed the rossoctl way: a plain Deployment + Service, adopted by an
# AgentRuntime. The AgentRuntime is what stamps rossoctl.io/type and asks the
# operator to inject the AuthBridge sidecar — the label cannot be set by hand
# (ValidatingAdmissionPolicy agent-label-protection reserves it).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: priorauth-coding-tool
  namespace: team2
---
apiVersion: v1
kind: Service
metadata:
  name: priorauth-coding-tool
  namespace: team2
  labels:
    app.kubernetes.io/name: priorauth-coding-tool
spec:
  ports:
    - name: http
      port: 8000
      protocol: TCP
      targetPort: 8000
  selector:
    app.kubernetes.io/name: priorauth-coding-tool
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: priorauth-coding-tool
  namespace: team2
  labels:
    app.kubernetes.io/name: priorauth-coding-tool
    app.kubernetes.io/component: tool
    app.kubernetes.io/part-of: priorauth
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: priorauth-coding-tool
  template:
    metadata:
      labels:
        app.kubernetes.io/name: priorauth-coding-tool
        app.kubernetes.io/part-of: priorauth
    spec:
      serviceAccountName: priorauth-coding-tool
      containers:
        - name: tool
          image: docker.io/library/priorauth_coding_tool:latest
          imagePullPolicy: IfNotPresent
          env:
            - { name: HOST, value: "0.0.0.0" }
            - { name: PORT, value: "8000" }
            - { name: UV_CACHE_DIR, value: "/app/.cache/uv" }

          ports:
            - { containerPort: 8000, name: http }
          readinessProbe:
            tcpSocket: { port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 24
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts:
            - { name: cache, mountPath: /app/.cache }
      volumes:
        - name: cache
          emptyDir: {}
---
apiVersion: agent.rossoctl.dev/v1alpha1
kind: AgentRuntime
metadata:
  name: priorauth-coding-tool
  namespace: team2
spec:
  type: tool
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: priorauth-coding-tool
