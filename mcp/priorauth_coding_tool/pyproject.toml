[project]
name = "priorauth-coding-tool"
version = "1.0.0"
description = "Medical Coding MCP tool — ICD-10 / CPT / drug reference lookups for the prior-authorization example."
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.4.2",
    "uvicorn>=0.49.0",
    "starlette>=1.3.1",
]

[project.scripts]
server = "priorauth_coding_tool:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["priorauth_coding_tool.py"]
